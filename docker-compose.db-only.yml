# Apenas PostgreSQL no Docker (imagem postgres:12 ja em cache local).
# Use com o JasperReports instalado pelo .exe no Windows.
#
# Subir:  docker compose -f docker-compose.db-only.yml up -d
# Parar:  docker compose -f docker-compose.db-only.yml down

services:
    jrs-postgresql:
        image: postgres:12
        container_name: jrs-postgresql
        environment:
            POSTGRES_USER: postgres
            POSTGRES_PASSWORD: postgres
        volumes:
            - jrs_pgdata:/var/lib/postgresql/data
        ports:
            - 5434:5432

volumes:
    jrs_pgdata:
